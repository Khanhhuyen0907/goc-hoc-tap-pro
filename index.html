<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Góc Học Tập Pro - Học thông minh cùng AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-full bg-slate-50 text-slate-800 antialiased">

    <!-- App Root Container -->
    <div id="app" class="min-h-full flex flex-col">
        <!-- Dynamic content will be mounted here -->
    </div>

    <!-- Notification Modal -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
        <div id="toast-content" class="flex items-center gap-3 px-5 py-4 rounded-2xl shadow-xl bg-slate-900 text-white border border-slate-700">
            <i id="toast-icon" class="text-xl"></i>
            <div>
                <h5 id="toast-title" class="font-bold text-sm">Thông báo</h5>
                <p id="toast-msg" class="text-xs text-slate-300"></p>
            </div>
        </div>
    </div>

    <!-- Main JavaScript Application Logic -->
    <script>
        // State Management
        const state = {
            currentUser: JSON.parse(localStorage.getItem('goc_hoc_tap_user')) || null, // { role: 'parent' | 'kid', name: '...' }
            apiKey: localStorage.getItem('goc_hoc_tap_api_key') || '',
            assignments: JSON.parse(localStorage.getItem('goc_hoc_tap_assignments')) || [
                {
                    id: '1',
                    title: 'Đọc truyện The Very Hungry Caterpillar',
                    type: 'Đọc sách / Raz-Kids',
                    description: 'Đọc trang 1-10 và tóm tắt lại 3 món ăn chú sâu đã ăn.',
                    dueDate: '2026-04-30',
                    status: 'pending', // pending, submitted, approved
                    proof: null,
                    feedback: null,
                    createdAt: new Date().toISOString()
                },
                {
                    id: '2',
                    title: 'Học 10 từ vựng Chủ đề Động vật',
                    type: 'Từ vựng (AZVocab)',
                    description: 'Hoàn thành bài flashcard và luyện phát âm chuẩn qua AI.',
                    dueDate: '2026-05-01',
                    status: 'submitted',
                    proof: { type: 'text', content: 'Con đã học xong và đạt 9/10 điểm từ vựng ạ!', imageUrl: 'https://placehold.co/600x400/16a34a/ffffff?text=Bai+Tap+Hoan+Thanh' },
                    feedback: 'Làm rất tốt con ơi! Cố gắng phát huy nhé.',
                    createdAt: new Date().toISOString()
                }
            ],
            aiChatHistory: JSON.parse(localStorage.getItem('goc_hoc_tap_chat')) || [
                { role: 'model', text: 'Xin chào bé yêu! Hôm nay chúng ta cùng luyện nói tiếng Anh về chủ đề gì nào? Con thích động vật hay vũ trụ?' }
            ],
            aiPersona: localStorage.getItem('goc_hoc_tap_persona') || 'Bạn thân hoạt bát, sửa phát âm tiếng Anh nhẹ nhàng',
            activeTab: 'dashboard'
        };

        // Save state to LocalStorage
        function saveState() {
            localStorage.setItem('goc_hoc_tap_user', JSON.stringify(state.currentUser));
            localStorage.setItem('goc_hoc_tap_api_key', state.apiKey);
            localStorage.setItem('goc_hoc_tap_assignments', JSON.stringify(state.assignments));
            localStorage.setItem('goc_hoc_tap_chat', JSON.stringify(state.aiChatHistory));
            localStorage.setItem('goc_hoc_tap_persona', state.aiPersona);
        }

        // UI Toast Notification helper
        function showToast(title, msg, type = 'success') {
            const toast = document.getElementById('toast');
            const toastTitle = document.getElementById('toast-title');
            const toastMsg = document.getElementById('toast-msg');
            const toastIcon = document.getElementById('toast-icon');

            toastTitle.innerText = title;
            toastMsg.innerText = msg;
            
            if (type === 'success') {
                toastIcon.className = 'fas fa-check-circle text-emerald-400 text-xl';
            } else if (type === 'error') {
                toastIcon.className = 'fas fa-exclamation-circle text-rose-400 text-xl';
            } else {
                toastIcon.className = 'fas fa-info-circle text-sky-400 text-xl';
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3500);
        }

        // Router / View Render Engine
        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            if (!state.currentUser) {
                app.innerHTML = renderAuthScreen();
                attachAuthEvents();
            } else if (state.currentUser.role === 'parent') {
                app.innerHTML = renderParentDashboard();
                attachParentEvents();
            } else {
                app.innerHTML = renderKidDashboard();
                attachKidEvents();
            }
        }

        // ==========================================
        // 1. AUTHENTICATION SCREEN
        // ==========================================
        function renderAuthScreen() {
            return `
                <div class="flex-1 flex items-center justify-center p-4 bg-gradient-to-br from-emerald-50 via-teal-50 to-cyan-100">
                    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 border border-slate-100">
                        <div class="text-center mb-8">
                            <div class="inline-flex items-center justify-center w-20 h-20 bg-emerald-100 rounded-2xl text-emerald-600 text-3xl mb-4 shadow-inner">
                                <i class="fas fa-graduation-cap"></i>
                            </div>
                            <h1 class="text-2xl font-bold text-slate-900">Góc Học Tập Pro</h1>
                            <p class="text-sm text-slate-500 mt-1">Nền tảng học tập thông minh gắn kết Mẹ & Con cùng AI</p>
                        </div>

                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-2">Chọn Vai Trò Trải Nghiệm</label>
                                <div class="grid grid-cols-2 gap-4">
                                    <button onclick="loginAs('parent')" class="flex flex-col items-center justify-center p-4 rounded-2xl border-2 border-emerald-500 bg-emerald-50 text-emerald-700 font-bold hover:bg-emerald-100 transition shadow-sm">
                                        <i class="fas fa-user-shield text-2xl mb-2"></i>
                                        Chế độ Mẹ
                                        <span class="text-xs font-normal text-slate-500 mt-1">Giao bài & Quản lý</span>
                                    </button>
                                    <button onclick="loginAs('kid')" class="flex flex-col items-center justify-center p-4 rounded-2xl border-2 border-amber-400 bg-amber-50 text-amber-700 font-bold hover:bg-amber-100 transition shadow-sm">
                                        <i class="fas fa-child text-2xl mb-2"></i>
                                        Chế độ Con
                                        <span class="text-xs font-normal text-slate-500 mt-1">Học & Nói chuyện AI</span>
                                    </button>
                                </div>
                            </div>

                            <div class="pt-4 border-t border-slate-100">
                                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Cấu hình Google Gemini API Key (Tùy chọn)</label>
                                <p class="text-xs text-slate-400 mb-2">Dùng để kích hoạt AI Tutor trò chuyện thông minh không giới hạn.</p>
                                <input type="password" id="globalApiKey" value="${state.apiKey}" placeholder="Nhập API Key của bạn (hoặc dùng mặc định)..." class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            </div>

                            <button onclick="saveApiKeyAndStart()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg shadow-emerald-600/20 transition flex items-center justify-center gap-2">
                                <i class="fas fa-rocket"></i> Bắt đầu ngay
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function loginAs(role) {
            state.currentUser = {
                role: role,
                name: role === 'parent' ? 'Mẹ Yêu' : 'Bé Minh Quân'
            };
            const keyInput = document.getElementById('globalApiKey');
            if (keyInput) state.apiKey = keyInput.value.trim();
            saveState();
            render();
            showToast('Đăng nhập thành công', `Chào mừng bạn đến với Góc học tập (${role === 'parent' ? 'Mẹ' : 'Con'})!`);
        }

        function saveApiKeyAndStart() {
            const keyInput = document.getElementById('globalApiKey');
            if (keyInput) state.apiKey = keyInput.value.trim();
            saveState();
            showToast('Đã lưu cấu hình', 'Vui lòng chọn vai trò Mẹ hoặc Con phía trên để tiếp tục!');
        }

        function logout() {
            state.currentUser = null;
            saveState();
            render();
            showToast('Đã đăng xuất', 'Hẹn gặp lại bạn!', 'info');
        }

        // ==========================================
        // 2. PARENT DASHBOARD
        // ==========================================
        function renderParentDashboard() {
            const pendingCount = state.assignments.filter(a => a.status === 'submitted').length;
            const totalCount = state.assignments.length;
            const completedCount = state.assignments.filter(a => a.status === 'approved').length;

            return `
                <div class="min-h-full flex flex-col bg-slate-100">
                    <!-- Top Navigation -->
                    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-xl bg-emerald-600 text-white flex items-center justify-center font-bold text-lg shadow-md">
                                    <i class="fas fa-user-shield"></i>
                                </div>
                                <div>
                                    <h1 class="font-bold text-slate-800">Bảng Quản Lý Của Mẹ</h1>
                                    <p class="text-xs text-slate-500">Giám sát tiến độ & Giao bài cho con</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-3">
                                <button onclick="switchRoleToKid()" class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-lg bg-amber-100 text-amber-800 text-xs font-semibold hover:bg-amber-200 transition">
                                    <i class="fas fa-exchange-alt"></i> Xem giao diện con
                                </button>
                                <button onclick="logout()" class="px-3 py-1.5 rounded-lg bg-rose-50 text-rose-600 text-xs font-semibold hover:bg-rose-100 transition">
                                    <i class="fas fa-sign-out-alt"></i> Đăng xuất
                                </button>
                            </div>
                        </div>
                    </header>

                    <!-- Main Content -->
                    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
                        <!-- Stats Overview -->
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                                <div>
                                    <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Tổng bài giao</p>
                                    <h3 class="text-2xl font-bold text-slate-900 mt-1">${totalCount}</h3>
                                </div>
                                <div class="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center text-xl">
                                    <i class="fas fa-book"></i>
                                </div>
                            </div>
                            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                                <div>
                                    <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Cần duyệt bằng chứng</p>
                                    <h3 class="text-2xl font-bold text-amber-600 mt-1">${pendingCount}</h3>
                                </div>
                                <div class="w-12 h-12 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center text-xl">
                                    <i class="fas fa-bell"></i>
                                </div>
                            </div>
                            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                                <div>
                                    <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Đã hoàn thành tốt</p>
                                    <h3 class="text-2xl font-bold text-emerald-600 mt-1">${completedCount}</h3>
                                </div>
                                <div class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl">
                                    <i class="fas fa-check-double"></i>
                                </div>
                            </div>
                        </div>

                        <!-- Action Tabs -->
                        <div class="flex gap-2 border-b border-slate-200 pb-2">
                            <button onclick="setParentTab('assignments')" id="tab-btn-assignments" class="px-4 py-2 rounded-xl font-semibold text-sm transition bg-emerald-600 text-white shadow">
                                <i class="fas fa-tasks mr-2"></i> Quản lý & Giao Bài
                            </button>
                            <button onclick="setParentTab('ai-config')" id="tab-btn-ai-config" class="px-4 py-2 rounded-xl font-semibold text-sm transition bg-white text-slate-600 hover:bg-slate-100">
                                <i class="fas fa-robot mr-2"></i> Cấu hình AI Tutor
                            </button>
                        </div>

                        <!-- Tab 1: Assignments Management -->
                        <div id="parent-tab-assignments" class="space-y-6">
                            <!-- Create New Assignment Form -->
                            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                                <h3 class="font-bold text-slate-800 text-lg mb-4 flex items-center gap-2">
                                    <i class="fas fa-plus-circle text-emerald-600"></i> Giao Bài Tập Mới Cho Con
                                </h3>
                                <form id="createAssignmentForm" onsubmit="handleCreateAssignment(event)" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-600 mb-1">Tiêu đề bài học</label>
                                        <input type="text" id="newTitle" required placeholder="VD: Đọc sách trang 15..." class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-600 mb-1">Loại bài tập</label>
                                        <select id="newType" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                            <option value="Đọc sách / Raz-Kids">Đọc sách / Raz-Kids</option>
                                            <option value="Từ vựng (AZVocab)">Từ vựng (AZVocab)</option>
                                            <option value="Luyện nói tiếng Anh AI">Luyện nói tiếng Anh AI</option>
                                            <option value="Toán học / Tư duy">Toán học / Tư duy</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-600 mb-1">Hạn nộp</label>
                                        <input type="date" id="newDueDate" required class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                    </div>
                                    <div class="sm:col-span-2 lg:col-span-4">
                                        <label class="block text-xs font-semibold text-slate-600 mb-1">Nội dung chi tiết / Yêu cầu</label>
                                        <textarea id="newDesc" rows="2" placeholder="Ghi chú rõ yêu cầu cho con..." class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
                                    </div>
                                    <div class="sm:col-span-2 lg:col-span-4 flex justify-end">
                                        <button type="submit" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow transition text-sm">
                                            <i class="fas fa-paper-plane mr-1"></i> Giao Bài Ngay
                                        </button>
                                    </div>
                                </form>
                            </div>

                            <!-- Assignment List & Proof Review -->
                            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                                <h3 class="font-bold text-slate-800 text-lg mb-4 flex items-center gap-2">
                                    <i class="fas fa-clipboard-list text-emerald-600"></i> Tiến Độ & Bằng Chứng Hoàn Thành Của Con
                                </h3>

                                <div class="space-y-4">
                                    ${state.assignments.length === 0 ? '<p class="text-slate-400 text-center py-8">Chưa có bài tập nào được giao.</p>' : ''}
                                    ${state.assignments.map(a => `
                                        <div class="p-5 rounded-2xl border border-slate-200 bg-slate-50/50 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                            <div class="space-y-1">
                                                <div class="flex items-center gap-2">
                                                    <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${
                                                        a.status === 'approved' ? 'bg-emerald-100 text-emerald-700' :
                                                        a.status === 'submitted' ? 'bg-amber-100 text-amber-700' : 'bg-slate-200 text-slate-700'
                                                    }">
                                                        ${a.status === 'approved' ? 'Đã duyệt' : a.status === 'submitted' ? 'Chờ mẹ duyệt' : 'Đang làm'}
                                                    </span>
                                                    <span class="text-xs text-slate-400 font-medium">${a.type}</span>
                                                    <span class="text-xs text-rose-500 font-medium">Hạn: ${a.dueDate}</span>
                                                </div>
                                                <h4 class="font-bold text-slate-900 text-base">${a.title}</h4>
                                                <p class="text-xs text-slate-600">${a.description}</p>
                                                
                                                ${a.proof ? `
                                                    <div class="mt-3 p-3 bg-white rounded-xl border border-emerald-200 text-xs space-y-2">
                                                        <p class="font-semibold text-emerald-800"><i class="fas fa-shield-check mr-1"></i> Bằng chứng con nộp:</p>
                                                        <p class="text-slate-700">${a.proof.content || 'Không có ghi chú text.'}</p>
                                                        ${a.proof.imageUrl ? `<img src="${a.proof.imageUrl}" class="w-32 h-20 object-cover rounded-lg border border-slate-200 shadow-sm">` : ''}
                                                    </div>
                                                ` : '<p class="text-xs text-slate-400 italic mt-1">Con chưa nộp bằng chứng.</p>'}
                                            </div>

                                            <div class="flex flex-col gap-2 w-full md:w-auto">
                                                ${a.status === 'submitted' ? `
                                                    <button onclick="approveAssignment('${a.id}')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs transition shadow flex items-center justify-center gap-1">
                                                        <i class="fas fa-check"></i> Duyệt hoàn thành
                                                    </button>
                                                ` : ''}
                                                <button onclick="deleteAssignment('${a.id}')" class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 font-semibold rounded-xl text-xs transition text-center">
                                                    Xóa bài
                                                </button>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>

                        <!-- Tab 2: AI Config -->
                        <div id="parent-tab-ai-config" class="hidden space-y-6">
                            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm max-w-2xl">
                                <h3 class="font-bold text-slate-800 text-lg mb-2 flex items-center gap-2">
                                    <i class="fas fa-robot text-emerald-600"></i> Cấu Hình AI Tutor Cho Con
                                </h3>
                                <p class="text-xs text-slate-500 mb-6">Mẹ có thể tùy chỉnh tính cách và prompt mẫu để con tương tác hiệu quả nhất với trợ lý AI.</p>
                                
                                <div class="space-y-4">
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-600 mb-1">Google Gemini API Key</label>
                                        <input type="password" id="parentApiKey" value="${state.apiKey}" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Nhập API Key...">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-600 mb-1">Tính cách & Nhiệm vụ của AI (Persona Prompt)</label>
                                        <textarea id="parentPersona" rows="4" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">${state.aiPersona}</textarea>
                                    </div>
                                    <button onclick="saveAiConfig()" class="px-6 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm transition shadow">
                                        Lưu Cấu Hình AI
                                    </button>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            `;
        }

        function setParentTab(tabName) {
            const btnAssign = document.getElementById('tab-btn-assignments');
            const btnConfig = document.getElementById('tab-btn-ai-config');
            const contentAssign = document.getElementById('parent-tab-assignments');
            const contentConfig = document.getElementById('parent-tab-ai-config');

            if (tabName === 'assignments') {
                btnAssign.className = "px-4 py-2 rounded-xl font-semibold text-sm transition bg-emerald-600 text-white shadow";
                btnConfig.className = "px-4 py-2 rounded-xl font-semibold text-sm transition bg-white text-slate-600 hover:bg-slate-100";
                contentAssign.classList.remove('hidden');
                contentConfig.classList.add('hidden');
            } else {
                btnConfig.className = "px-4 py-2 rounded-xl font-semibold text-sm transition bg-emerald-600 text-white shadow";
                btnAssign.className = "px-4 py-2 rounded-xl font-semibold text-sm transition bg-white text-slate-600 hover:bg-slate-100";
                contentConfig.classList.remove('hidden');
                contentAssign.classList.add('hidden');
            }
        }

        function handleCreateAssignment(e) {
            e.preventDefault();
            const title = document.getElementById('newTitle').value.trim();
            const type = document.getElementById('newType').value;
            const dueDate = document.getElementById('newDueDate').value;
            const description = document.getElementById('newDesc').value.trim();

            if (!title || !dueDate) {
                showToast('Lỗi', 'Vui lòng nhập đầy đủ tiêu đề và hạn nộp!', 'error');
                return;
            }

            const newAssignment = {
                id: Date.now().toString(),
                title,
                type,
                description,
                dueDate,
                status: 'pending',
                proof: null,
                feedback: null,
                createdAt: new Date().toISOString()
            };

            state.assignments.unshift(newAssignment);
            saveState();
            render();
            showToast('Thành công', 'Đã giao bài tập mới cho con!');
        }

        function approveAssignment(id) {
            const assignment = state.assignments.find(a => a.id === id);
            if (assignment) {
                assignment.status = 'approved';
                saveState();
                render();
                showToast('Đã duyệt', 'Bằng chứng đã được chấp nhận. Con tuyệt lắm!');
            }
        }

        function deleteAssignment(id) {
            state.assignments = state.assignments.filter(a => a.id !== id);
            saveState();
            render();
            showToast('Đã xóa', 'Bài tập đã được xóa khỏi hệ thống.', 'info');
        }

        function saveAiConfig() {
            state.apiKey = document.getElementById('parentApiKey').value.trim();
            state.aiPersona = document.getElementById('parentPersona').value.trim();
            saveState();
            showToast('Thành công', 'Đã cập nhật cấu hình AI Tutor!');
        }

        function switchRoleToKid() {
            state.currentUser = { role: 'kid', name: 'Bé Minh Quân' };
            saveState();
            render();
            showToast('Chuyển chế độ', 'Đang chuyển sang giao diện của Con!');
        }


        // ==========================================
        // 3. KID DASHBOARD
        // ==========================================
        function renderKidDashboard() {
            return `
                <div class="min-h-full flex flex-col bg-slate-900 text-white">

                    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30 shadow-lg">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-xl bg-amber-500 text-slate-900 flex items-center justify-center font-extrabold text-lg shadow-lg">
                                    <i class="fas fa-child"></i>
                                </div>
                                <div>
                                    <h1 class="font-bold text-white text-base">Góc Học Tập Của Con 🌟</h1>
                                    <p class="text-xs text-amber-400 font-medium">Học vui - Nhận quà cùng AI Tutor</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-3">
                                <button onclick="switchRoleToParent()" class="px-3 py-1.5 rounded-lg bg-emerald-600/30 text-emerald-400 text-xs font-semibold hover:bg-emerald-600/50 transition">
                                    <i class="fas fa-user-shield"></i> Chế độ Mẹ
                                </button>
                                <button onclick="logout()" class="px-3 py-1.5 rounded-lg bg-rose-500/20 text-rose-400 text-xs font-semibold hover:bg-rose-500/40 transition">
                                    Thoát
                                </button>
                            </div>
                        </div>
                    </header>

                    <!-- Main Kid Navigation Tabs -->
                    <div class="bg-slate-800/60 border-b border-slate-700">
                        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex gap-4 overflow-x-auto">
                            <button onclick="setKidTab('tasks')" id="kid-tab-btn-tasks" class="py-3 px-4 border-b-2 border-amber-400 text-amber-400 font-bold text-sm flex items-center gap-2 whitespace-nowrap">
                                <i class="fas fa-book-open"></i> Bài tập của mẹ giao
                            </button>
                            <button onclick="setKidTab('ai')" id="kid-tab-btn-ai" class="py-3 px-4 border-b-2 border-transparent text-slate-400 hover:text-white font-bold text-sm flex items-center gap-2 whitespace-nowrap">
                                <i class="fas fa-robot text-emerald-400"></i> Trò chuyện & Luyện nói cùng AI 🤖
                            </button>
                        </div>
                    </div>

                    <!-- Kid Content Container -->
                    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
                        <!-- Tab Tasks -->
                        <div id="kid-view-tasks" class="space-y-4">
                            <div class="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                                <h3 class="font-bold text-lg mb-4 flex items-center gap-2 text-amber-300">
                                    <i class="fas fa-list-check"></i> Danh Sách Bài Tập Cần Làm
                                </h3>

                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    ${state.assignments.map(a => `
                                        <div class="bg-slate-700/50 border border-slate-600 p-5 rounded-2xl flex flex-col justify-between gap-4">
                                            <div class="space-y-1">
                                                <div class="flex items-center justify-between">
                                                    <span class="text-xs px-2.5 py-0.5 rounded-full font-bold ${
                                                        a.status === 'approved' ? 'bg-emerald-500/20 text-emerald-400' :
                                                        a.status === 'submitted' ? 'bg-amber-500/20 text-amber-400' : 'bg-blue-500/20 text-blue-400'
                                                    }">
                                                        ${a.status === 'approved' ? '✨ Mẹ đã duyệt' : a.status === 'submitted' ? '⏳ Chờ mẹ duyệt' : '🔥 Chưa hoàn thành'}
                                                    </span>
                                                    <span class="text-xs text-slate-400">${a.type}</span>
                                                </div>
                                                <h4 class="font-bold text-white text-lg mt-1">${a.title}</h4>
                                                <p class="text-xs text-slate-300">${a.description}</p>
                                                <p class="text-xs text-rose-400 font-medium">Hạn nộp: ${a.dueDate}</p>
                                            </div>

                                            <div>
                                                ${a.status === 'approved' ? `
                                                    <div class="p-3 bg-emerald-900/30 border border-emerald-700 rounded-xl text-xs text-emerald-300 flex items-center gap-2">
                                                        <i class="fas fa-award text-base text-amber-400"></i> Bài này con đã hoàn thành xuất sắc!
                                                    </div>
                                                ` : a.status === 'submitted' ? `
                                                    <div class="p-3 bg-amber-900/30 border border-amber-700 rounded-xl text-xs text-amber-300">
                                                        Đã nộp bằng chứng. Đang chờ mẹ chấm điểm nhé!
                                                    </div>
                                                ` : `
                                                    <button onclick="openSubmitModal('${a.id}')" class="w-full py-2.5 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-slate-900 font-extrabold rounded-xl text-xs transition shadow-lg flex items-center justify-center gap-2">
                                                        <i class="fas fa-camera"></i> Nộp Bài & Bằng Chứng Ngay
                                                    </button>
                                                `}
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>

                        <!-- Tab AI Chat Tutor -->
                        <div id="kid-view-ai" class="hidden flex flex-col h-[650px] bg-slate-800 rounded-3xl border border-slate-700 shadow-2xl overflow-hidden">
                            <!-- AI Header Bar -->
                            <div class="bg-slate-700/80 px-6 py-4 flex items-center justify-between border-b border-slate-600">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-2xl bg-emerald-500 text-slate-900 flex items-center justify-center text-lg font-bold">
                                        <i class="fas fa-robot"></i>
                                    </div>
                                    <div>
                                        <h4 class="font-bold text-white text-sm">Gia Sư AI Thông Minh</h4>
                                        <p class="text-xs text-emerald-400">Sẵn sàng luyện nói & thảo luận cùng bé</p>
                                    </div>
                                </div>
                                <button onclick="clearChatHistory()" class="px-3 py-1.5 bg-slate-600 hover:bg-slate-500 text-slate-200 text-xs font-semibold rounded-xl transition">
                                    <i class="fas fa-redo mr-1"></i> Làm mới hội thoại
                                </button>
                            </div>

                            <!-- Chat Messages Area -->
                            <div id="chatMessagesContainer" class="flex-1 p-6 overflow-y-auto space-y-4">
                                ${state.aiChatHistory.map(msg => `
                                    <div class="flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}">
                                        <div class="max-w-[80%] rounded-2xl px-5 py-3 text-sm ${
                                            msg.role === 'user' 
                                                ? 'bg-emerald-600 text-white rounded-br-none shadow-md' 
                                                : 'bg-slate-700 text-slate-100 rounded-bl-none border border-slate-600 shadow-md'
                                        }">
                                            <p class="whitespace-pre-wrap">${msg.text}</p>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>

                            <!-- Chat Input Form -->
                            <div class="p-4 bg-slate-700/80 border-t border-slate-600">
                                <form onsubmit="handleSendAiMessage(event)" class="flex gap-2">
                                    <input type="text" id="aiInput" placeholder="Nhập câu hỏi hoặc câu trả lời bằng tiếng Anh/Việt..." class="flex-1 px-4 py-3 bg-slate-900 text-white placeholder-slate-400 rounded-xl border border-slate-600 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                    <button type="submit" id="aiSendBtn" class="px-6 py-3 bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-extrabold rounded-xl transition shadow flex items-center gap-2">
                                        <i class="fas fa-paper-plane"></i> Gửi
                                    </button>
                                </form>
                            </div>
                        </div>
                    </main>
                </div>

                <!-- Proof Submission Modal -->
                <div id="submitModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/70 backdrop-blur-sm hidden">
                    <div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 max-w-md w-full mx-4 shadow-2xl space-y-4">
                        <h3 class="font-bold text-lg text-white flex items-center gap-2">
                            <i class="fas fa-upload text-amber-400"></i> Nộp Bằng Chứng Hoàn Thành
                        </h3>
                        <p class="text-xs text-slate-400">Nhập ghi chú hoặc mô tả kết quả con đã làm được để mẹ xem nhé.</p>
                        <input type="hidden" id="modalAssignmentId">
                        <div class="space-y-3">
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1">Ghi chú của con</label>
                                <textarea id="modalProofContent" rows="3" placeholder="VD: Con đã đọc xong và trả lời đúng hết các câu hỏi..." class="w-full px-3 py-2 bg-slate-900 text-white rounded-xl border border-slate-600 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"></textarea>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1">Link ảnh minh chứng (Tùy chọn)</label>
                                <input type="text" id="modalProofImg" placeholder="https://..." class="w-full px-3 py-2 bg-slate-900 text-white rounded-xl border border-slate-600 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                            </div>
                        </div>
                        <div class="flex justify-end gap-3 pt-2">
                            <button type="button" onclick="closeSubmitModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white text-xs font-semibold rounded-xl">Hủy</button>
                            <button type="button" onclick="submitProofConfirm()" class="px-5 py-2 bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold text-xs rounded-xl shadow">Nộp Bài Ngay</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function setKidTab(tabName) {
            const btnTasks = document.getElementById('kid-tab-btn-tasks');
            const btnAi = document.getElementById('kid-tab-btn-ai');
            const viewTasks = document.getElementById('kid-view-tasks');
            const viewAi = document.getElementById('kid-view-ai');

            if (tabName === 'tasks') {
                btnTasks.className = "py-3 px-4 border-b-2 border-amber-400 text-amber-400 font-bold text-sm flex items-center gap-2 whitespace-nowrap";
                btnAi.className = "py-3 px-4 border-b-2 border-transparent text-slate-400 hover:text-white font-bold text-sm flex items-center gap-2 whitespace-nowrap";
                viewTasks.classList.remove('hidden');
                viewAi.classList.add('hidden');
            } else {
                btnAi.className = "py-3 px-4 border-b-2 border-emerald-400 text-emerald-400 font-bold text-sm flex items-center gap-2 whitespace-nowrap";
                btnTasks.className = "py-3 px-4 border-b-2 border-transparent text-slate-400 hover:text-white font-bold text-sm flex items-center gap-2 whitespace-nowrap";
                viewAi.classList.remove('hidden');
                viewTasks.classList.add('hidden');
                
                // Scroll chat to bottom
                const container = document.getElementById('chatMessagesContainer');
                if (container) container.scrollTop = container.scrollHeight;
            }
        }

        function switchRoleToParent() {
            state.currentUser = { role: 'parent', name: 'Mẹ Yêu' };
            saveState();
            render();
            showToast('Chuyển chế độ', 'Đang chuyển sang giao diện của Mẹ!');
        }

        function openSubmitModal(id) {
            document.getElementById('modalAssignmentId').value = id;
            document.getElementById('submitModal').classList.remove('hidden');
        }

        function closeSubmitModal() {
            document.getElementById('submitModal').classList.add('hidden');
        }

        function submitProofConfirm() {
            const id = document.getElementById('modalAssignmentId').value;
            const content = document.getElementById('modalProofContent').value.trim();
            const imageUrl = document.getElementById('modalProofImg').value.trim();

            const assignment = state.assignments.find(a => a.id === id);
            if (assignment) {
                assignment.status = 'submitted';
                assignment.proof = {
                    content: content || 'Đã hoàn thành bài học.',
                    imageUrl: imageUrl || 'https://placehold.co/600x400/22c55e/ffffff?text=Bai+Hoan+Thanh+Cua+Con'
                };
                saveState();
                closeSubmitModal();
                render();
                showToast('Nộp bài thành công', 'Đã gửi bằng chứng cho mẹ xem xét!');
            }
        }

        function clearChatHistory() {
            state.aiChatHistory = [
                { role: 'model', text: 'Xin chào bé yêu! Hôm nay chúng ta cùng luyện nói tiếng Anh về chủ đề gì nào?' }
            ];
            saveState();
            render();
            setKidTab('ai');
            showToast('Đã làm mới', 'Đã khởi tạo lại cuộc trò chuyện với AI.', 'info');
        }

        // ==========================================
        // 4. GEMINI AI API INTEGRATION
        // ==========================================
        async function handleSendAiMessage(e) {
            e.preventDefault();
            const inputEl = document.getElementById('aiInput');
            const userText = inputEl.value.trim();
            if (!userText) return;

            // Push user message
            state.aiChatHistory.push({ role: 'user', text: userText });
            inputEl.value = '';
            render();
            setKidTab('ai');

            // Add loading placeholder
            state.aiChatHistory.push({ role: 'model', text: '🤖 AI đang suy nghĩ và trả lời bé...' });
            render();
            setKidTab('ai');

            try {
                const apiKey = state.apiKey || ''; // If empty, platform runtime provides key
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                const systemInstruction = `Bạn là một trợ lý giáo dục AI thân thiện, vui vẻ dành cho trẻ em học tập (Góc Học Tập Pro). Nhiệm vụ của bạn: ${state.aiPersona}. Hãy luôn dùng từ ngữ ngọt ngào, khích lệ bé, sửa phát âm hoặc ngữ pháp nhẹ nhàng nếu bé nói tiếng Anh sai, và giữ câu trả lời ngắn gọn, dễ hiểu cho lứa tuổi học sinh tiểu học/mầm non.`;

                // Build contents payload
                const contents = state.aiChatHistory.slice(0, -1).map(msg => ({
                    role: msg.role === 'user' ? 'user' : 'model',
                    parts: [{ text: msg.text }]
                }));

                const payload = {
                    contents: contents,
                    systemInstruction: {
                        parts: [{ text: systemInstruction }]
                    }
                };

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                const candidate = result.candidates?.[0];

                if (candidate && candidate.content?.parts?.[0]?.text) {
                    const aiReply = candidate.content.parts[0].text;
                    state.aiChatHistory.pop(); // remove loading
                    state.aiChatHistory.push({ role: 'model', text: aiReply });
                } else {
                    throw new Error('Invalid response structure');
                }
            } catch (error) {
                console.error('AI Error:', error);
                state.aiChatHistory.pop();
                state.aiChatHistory.push({ role: 'model', text: '🌟 Chào con! Hình như kết nối AI đang bận chút xíu, con hãy thử nhắn lại cho cô/thầy nhé!' });
            }

            saveState();
            render();
            setKidTab('ai');
        }

        // Attach Event Listeners on dynamic renders if needed
        function attachAuthEvents() {}
        function attachParentEvents() {}
        function attachKidEvents() {}

        // Initial Boot
        window.onload = function() {
            render();
        };
    </script>
